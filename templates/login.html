<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión Stock Fiscal | GS — Iniciar sesión</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background: #F5F6F7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      padding: 40px 36px 32px;
      width: 100%;
      max-width: 380px;
    }
    .brand-bar {
      background: #1C2B3F;
      border-radius: 6px 6px 0 0;
      padding: 18px 24px;
      margin: -40px -36px 28px;
      color: #fff;
    }
    .brand-bar h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .3px; }
    .brand-bar p  { font-size: 12px; color: #a0b4c8; margin: 3px 0 0; }
    .btn-primary  { background: #0070F2; border-color: #0070F2; }
    .btn-primary:hover { background: #0040B0; border-color: #0040B0; }
    .form-label   { font-size: 13px; font-weight: 500; color: #556; }
    .form-control { font-size: 14px; }
    .msg-box      { font-size: 13px; }
    .link-toggle  { font-size: 12px; color: #0070F2; cursor: pointer; text-decoration: none; }
    .link-toggle:hover { text-decoration: underline; }
    .form-section { transition: opacity .2s; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-bar">
      <h1><i class="fa fa-warehouse me-2"></i>Gestión Stock Fiscal | GS</h1>
      <p>Depósitos Fiscales ARCA</p>
    </div>

    <!-- ── Formulario de inicio de sesión ─────────────────────────── -->
    <div id="sectionLogin" class="form-section">
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" for="username">Usuario</label>
          <input id="username" type="text" class="form-control" placeholder="usuario"
                 autocomplete="username" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-group">
            <input id="password" type="password" class="form-control" placeholder="••••••••"
                   autocomplete="current-password" required>
            <button type="button" class="btn btn-outline-secondary" tabindex="-1"
                    onclick="togglePwd('password', this)">
              <i class="fa fa-eye"></i>
            </button>
          </div>
        </div>
        <div id="err-login" class="msg-box alert alert-danger d-none py-2"></div>
        <button type="submit" class="btn btn-primary w-100 mb-3" id="btnLogin">
          <i class="fa fa-sign-in-alt me-1"></i> Ingresar
        </button>
        <div class="text-center">
          <a class="link-toggle" onclick="mostrarCambio()">
            <i class="fa fa-key me-1"></i>Cambiar contraseña
          </a>
        </div>
      </form>
    </div>

    <!-- ── Formulario de cambio de contraseña ─────────────────────── -->
    <div id="sectionCambio" class="form-section d-none">
      <form id="cambioForm">
        <div class="mb-3">
          <label class="form-label" for="c-username">Usuario</label>
          <input id="c-username" type="text" class="form-control" placeholder="usuario"
                 autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="c-pwd-actual">Contraseña actual</label>
          <div class="input-group">
            <input id="c-pwd-actual" type="password" class="form-control" placeholder="••••••••"
                   autocomplete="current-password" required>
            <button type="button" class="btn btn-outline-secondary" tabindex="-1"
                    onclick="togglePwd('c-pwd-actual', this)">
              <i class="fa fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="c-pwd-nueva">Nueva contraseña</label>
          <div class="input-group">
            <input id="c-pwd-nueva" type="password" class="form-control" placeholder="mínimo 6 caracteres"
                   autocomplete="new-password" required minlength="6">
            <button type="button" class="btn btn-outline-secondary" tabindex="-1"
                    onclick="togglePwd('c-pwd-nueva', this)">
              <i class="fa fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="c-pwd-confirm">Confirmar nueva contraseña</label>
          <div class="input-group">
            <input id="c-pwd-confirm" type="password" class="form-control" placeholder="••••••••"
                   autocomplete="new-password" required>
            <button type="button" class="btn btn-outline-secondary" tabindex="-1"
                    onclick="togglePwd('c-pwd-confirm', this)">
              <i class="fa fa-eye"></i>
            </button>
          </div>
        </div>
        <div id="err-cambio" class="msg-box alert alert-danger d-none py-2"></div>
        <div id="ok-cambio" class="msg-box alert alert-success d-none py-2"></div>
        <button type="submit" class="btn btn-primary w-100 mb-3" id="btnCambio">
          <i class="fa fa-save me-1"></i> Guardar nueva contraseña
        </button>
        <div class="text-center">
          <a class="link-toggle" onclick="mostrarLogin()">
            <i class="fa fa-arrow-left me-1"></i>Volver al inicio de sesión
          </a>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ── Mostrar / ocultar contraseña ──────────────────────────────────
    function togglePwd(inputId, btn) {
      const inp  = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        inp.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    // ── Alternar entre secciones ──────────────────────────────────────
    function mostrarCambio() {
      document.getElementById('sectionLogin').classList.add('d-none');
      document.getElementById('sectionCambio').classList.remove('d-none');
      document.getElementById('c-username').focus();
    }
    function mostrarLogin() {
      document.getElementById('sectionCambio').classList.add('d-none');
      document.getElementById('sectionLogin').classList.remove('d-none');
      document.getElementById('username').focus();
      // Limpiar mensajes del formulario de cambio
      ['err-cambio','ok-cambio'].forEach(id =>
        document.getElementById(id).classList.add('d-none'));
      document.getElementById('cambioForm').reset();
    }

    // ── Login ─────────────────────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn    = document.getElementById('btnLogin');
      const errDiv = document.getElementById('err-login');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Ingresando...';
      errDiv.classList.add('d-none');
      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = '/';
        } else {
          errDiv.textContent = data.error || 'Error al iniciar sesión';
          errDiv.classList.remove('d-none');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa fa-sign-in-alt me-1"></i> Ingresar';
        }
      } catch {
        errDiv.textContent = 'Error de conexión con el servidor';
        errDiv.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa fa-sign-in-alt me-1"></i> Ingresar';
      }
    });

    // ── Cambiar contraseña ────────────────────────────────────────────
    document.getElementById('cambioForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn    = document.getElementById('btnCambio');
      const errDiv = document.getElementById('err-cambio');
      const okDiv  = document.getElementById('ok-cambio');
      errDiv.classList.add('d-none');
      okDiv.classList.add('d-none');

      const pwdNueva   = document.getElementById('c-pwd-nueva').value;
      const pwdConfirm = document.getElementById('c-pwd-confirm').value;

      if (pwdNueva !== pwdConfirm) {
        errDiv.textContent = 'Las contraseñas nuevas no coinciden';
        errDiv.classList.remove('d-none');
        return;
      }
      if (pwdNueva.length < 6) {
        errDiv.textContent = 'La nueva contraseña debe tener al menos 6 caracteres';
        errDiv.classList.remove('d-none');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Guardando...';
      try {
        const res  = await fetch('/api/auth/cambiar-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            username:        document.getElementById('c-username').value.trim(),
            password_actual: document.getElementById('c-pwd-actual').value,
            password_nueva:  pwdNueva,
            password_confirm: pwdConfirm
          })
        });
        const data = await res.json();
        if (data.ok) {
          okDiv.textContent = 'Contraseña actualizada. Podés iniciar sesión con la nueva contraseña.';
          okDiv.classList.remove('d-none');
          document.getElementById('cambioForm').reset();
          setTimeout(mostrarLogin, 2500);
        } else {
          errDiv.textContent = data.error || 'No se pudo actualizar la contraseña';
          errDiv.classList.remove('d-none');
        }
      } catch {
        errDiv.textContent = 'Error de conexión con el servidor';
        errDiv.classList.remove('d-none');
      }
      btn.disabled = false;
      btn.innerHTML = '<i class="fa fa-save me-1"></i> Guardar nueva contraseña';
    });
  </script>
</body>
</html>
